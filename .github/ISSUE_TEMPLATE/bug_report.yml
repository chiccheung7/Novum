name: Bug report
description: Report an issue with browsing, focus or playback
body:
  - type: markdown
    attributes:
      value: 请删除服务器地址、账号、令牌、私人媒体信息和未脱敏日志。
  - type: input
    id: version
    attributes:
      label: App version or commit
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: TV model and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: 包含进入的页面、遥控器按键顺序、实际结果和预期结果。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: 如为播放问题，补充脱敏错误码、容器与音视频编码；不要填写媒体链接或凭证。
